name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every version rather than stopping at the first failure —
      # with a multi-version matrix, "3.14 also fails" is information.
      fail-fast: false
      matrix:
        # 3.11 is the documented floor. The dependencies themselves
        # require >=3.10, but 3.10 reaches EOL in October 2026, so the
        # supported floor carries a version of margin.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked fails the build if pyproject.toml changed without
      # re-running `uv lock`, so the lockfile can never drift.
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -v
