# Version-update PRs. Security alerts and their fix PRs don't need this
# file and ignore the cooldown below — they open as soon as an advisory
# is published.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Chicago
    # Hold back releases younger than two weeks, so a yanked or
    # compromised version is caught before it reaches a PR.
    cooldown:
      default-days: 14
    # One PR for every minor/patch bump; majors arrive one at a time,
    # since each can carry breaking changes.
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # APScheduler 4 is a ground-up rewrite with a different API — the
      # <4 cap in pyproject.toml is deliberate.
      - dependency-name: apscheduler
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Chicago
    cooldown:
      default-days: 14
    # setup-uv is pinned to a commit SHA; Dependabot updates the SHA and
    # its version comment together.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
